name: Recover stuck GitHub Pages deployment
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/recover-pages-deployment.yml'
permissions:
  contents: read
  pages: write
jobs:
  cancel-stuck-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale Pages deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o /tmp/pages-cancel.json -w '%{http_code}' -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${{ github.repository }}/pages/deployments/27849d68b5a862ecc720294353244fe70a3f3cd5/cancel")
          echo "Cancel Pages deployment HTTP $code"
          if [ "$code" != "204" ]; then cat /tmp/pages-cancel.json; exit 1; fi
