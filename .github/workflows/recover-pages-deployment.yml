name: Recover Pages publishing mode
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/recover-pages-deployment.yml'
permissions:
  contents: read
  pages: write
jobs:
  switch-to-branch-publishing:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Pages and switch to branch source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Current GitHub Pages config:"
          gh api "repos/$GITHUB_REPOSITORY/pages" --jq '{build_type,source,status}' || true
          echo "Switch to main /docs branch publishing:"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=legacy -f 'source[branch]=main' -f 'source[path]=/docs'
          echo "Updated GitHub Pages config:"
          gh api "repos/$GITHUB_REPOSITORY/pages" --jq '{build_type,source,status}'
