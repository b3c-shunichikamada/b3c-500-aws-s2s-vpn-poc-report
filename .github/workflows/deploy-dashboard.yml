name: Build MagicPath dashboard into GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'dashboard-app/**'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard-app/package-lock.json
      - name: Install and compile
        working-directory: dashboard-app
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit generated Pages entry and assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/dashboard-assets
          if ! git diff --cached --quiet; then
            git commit -m "Deploy MagicPath dashboard to GitHub Pages"
            git push
          fi
